# Research probe, never merged: what an agent can see and do in the app on a GitHub Mac runner.
name: UI probe
on:
  pull_request:
    paths: ['.github/workflows/ui-probe.yml', '.github/ui-probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the newest Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
      - name: What the runner grants
        run: |
          set -x
          mkdir -p out
          { sw_vers; csrutil status; whoami; id
            echo "== automationmodetool"; automationmodetool 2>&1 || true
            echo "== system TCC"; sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value from access order by service, client" 2>&1 || true
            echo "== user TCC"; sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value from access order by service, client" 2>&1 || true
            echo "== displays"; system_profiler SPDisplaysDataType 2>&1 | head -30
          } > out/00-environment.txt 2>&1
          cat out/00-environment.txt
      - name: Build the app and the probe tools
        run: |
          set -euo pipefail
          source Scripts/lib/build-settings.sh
          xcodebuild -project "Markdown Editor.xcodeproj" -scheme "Markdown Editor" -configuration Debug \
            -derivedDataPath .build/probe "${verification_build_settings[@]}" build > out/build.log 2>&1 || { tail -40 out/build.log; exit 1; }
          swiftc -O .github/ui-probe/ax.swift -o .build/ax
          swiftc -O Scripts/find-window-id.swift -o .build/find-window-id
      - name: Launch, look, drive, look
        run: |
          set -uo pipefail
          app=".build/probe/Build/Products/Debug/Markdown Editor.app"
          work="$(mktemp -d)"; cp -R Scripts/Fixtures/. "$work/"; doc="$work/smoke-rich.md"
          caffeinate -d -i -u -t 600 &
          MARKDOWN_EDITOR_DIAGNOSTICS_DIR="$PWD/out/diagnostics" "$app/Contents/MacOS/Markdown Editor" -ApplePersistenceIgnoreState YES "$doc" > out/app-stdout.txt 2>&1 &
          pid=$!
          wid=""
          for _ in $(seq 1 100); do wid="$(.build/find-window-id "$pid" 2>>out/find-window.txt | head -1)"; [[ -n "$wid" ]] && break; sleep 0.2; done
          echo "pid=$pid wid=$wid"
          shot() { screencapture -x -o -l "$wid" "out/$1.png" 2>&1 || screencapture -x "out/$1-full.png"; }
          sleep 2; shot 01-launched
          .build/ax trusted | tee out/02-trusted.txt
          .build/ax activate "$pid"
          .build/ax dump "$pid" > out/03-ax-tree.txt 2>&1; echo "ax tree lines: $(wc -l < out/03-ax-tree.txt)"; head -60 out/03-ax-tree.txt
          echo "== System Events"
          osascript -e 'tell application "System Events" to get name of first process whose frontmost is true' 2>&1 | tee out/04-system-events.txt
          osascript -e 'tell application "System Events" to keystroke "SYSEVENTS "' 2>&1 | tee -a out/04-system-events.txt
          sleep 1; shot 05-after-system-events-typing
          echo "== CGEvent"
          .build/ax activate "$pid"; .build/ax type "CGEVENT " | tee out/06-cgevent.txt
          sleep 1; shot 07-after-cgevent-typing
          echo "== AX press Source"
          .build/ax press "$pid" "Source" 2>&1 | tee out/08-press.txt
          sleep 1; shot 09-after-press-source
          .build/ax dump "$pid" > out/10-ax-tree-source.txt 2>&1
          echo "== Save with cmd-S and read the file back"
          .build/ax activate "$pid"; .build/ax key s cmd
          sleep 2
          head -c 400 "$doc" > out/11-file-head.txt; cat out/11-file-head.txt; echo
          grep -c "SYSEVENTS\|CGEVENT" "$doc" || echo "neither typed string reached the file"
          kill "$pid" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-probe-${{ github.run_id }}
          path: out/
          retention-days: 14
