# The verification of every change (CLAUDE.md, "The loop"). A cloud session has no Xcode, so for a
# change made there, the macOS job's run of Scripts/check.sh on the pull request's last commit is
# the gate. A change made on the Mac is verified by its local run; CI repeats it.
#
# A change confined to documentation skips the macOS job: it could not change what that job builds,
# and the five-minute budget (CLAUDE.md §2) is better spent elsewhere.
name: CI

on:
  pull_request:
    # `edited`: a description fixed after the push re-runs the checks that read it. Every job runs
    # on it, so the newest `CI gate` on a commit always reflects all the checks.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Weekly full run on main, off the hour, so rot from a new runner image or Xcode shows up.
    # Release ignores it: it publishes only after a push.
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Does it need macOS?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.classify.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mac() { echo "mac=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          if [[ "$EVENT" == workflow_dispatch || "$EVENT" == schedule || -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            mac true "full run ($EVENT)"
          fi
          # Everything outside this documentation set can change what builds, tests or ships.
          others="$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD" \
            | grep -vE '^(docs/.*|[^/]*\.md|\.claude/.*|\.markdownlint-cli2\.jsonc|\.gitignore)$' || true)"
          [[ -z "$others" ]] || mac true "$(printf 'needs macOS:\n%s' "$others")"
          # A push to main is also asked what Release will do next: it publishes whenever the app
          # differs from the newest release, so this run must have built that tree. Without this, a
          # documentation push after a main commit whose macOS job failed skipped macOS, passed, and
          # published the failed tree. v1.0.1 was published that way, from #91 after #90, whose main
          # run had been cancelled and had passed only as a pull request.
          if [[ "$EVENT" == push ]]; then
            source Scripts/lib/app-paths.sh
            released="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
              | sed -n 's/^source-commit: \([0-9a-f]\{40\}\)$/\1/p' | tail -n 1 || true)"
            if [[ -z "$released" ]] || ! git cat-file -e "$released^{commit}" 2>/dev/null; then
              mac true "no release to compare with, so Release may publish this tree"
            fi
            git diff --quiet "$released" "$HEAD" -- "${app_paths[@]}" \
              || mac true "the app differs from the newest release ($released), so Release will publish this tree"
          fi
          mac false "documentation only"

  portable:
    name: Portable steps (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exit 3 is check.sh's INCOMPLETE: every portable step passed and the build is the macOS job's.
      - run: |
          status=0
          Scripts/check.sh || status=$?
          [[ "$status" == 3 ]]

  process:
    name: Process
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pr-check diffs the pull request's base and head
          persist-credentials: false
      - name: process-check
        run: script/process-check
      - name: pr-check
        if: github.event_name == 'pull_request'
        run: script/pr-check

  macos:
    name: Build, test and smoke (Xcode 27)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      # The compilation cache (Scripts/lib/build-settings.sh) and the Swift packages, as main's
      # newest run left them. Only a push to main saves, so every pull request reads one trusted
      # copy and no branch's entries reach another. The key names the Xcode build: another
      # Xcode's entries could never be hits.
      - name: Restore the build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .build/check/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-
      - name: Scripts/check.sh
        run: Scripts/check.sh
      - name: Save the build caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .build/check/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
      # Evidence for human eyes, never a requirement's proof (CLAUDE.md §4): one capture of the
      # app's own window over the rich fixture, downloadable from the run. It does not gate.
      - name: Window screenshot
        if: success()
        continue-on-error: true
        env:
          SMOKE_SCREENSHOT_OUT: ${{ runner.temp }}/screenshot/smoke-screenshot.png
          # The smoke step's build folder (Scripts/check.sh): its app is already built, so this
          # build is a no-op instead of a second full one (about 50 s of the five-minute budget).
          SMOKE_DERIVED_DATA: .build/check/smoke
        run: |
          mkdir -p "$(dirname "$SMOKE_SCREENSHOT_OUT")"
          Scripts/smoke-screenshot.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        continue-on-error: true
        with:
          name: screenshot-${{ github.run_id }}
          path: ${{ runner.temp }}/screenshot/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/check.log
            .build/check/*.log
            .build/check/smoke-records/
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: CI gate
    needs: [changes, portable, process, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          PORTABLE: ${{ needs.portable.result }}
          PROCESS: ${{ needs.process.result }}
          MACOS: ${{ needs.macos.result }}
          NEEDS_MAC: ${{ needs.changes.outputs.mac }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES portable=$PORTABLE process=$PROCESS macos=$MACOS needsMac=$NEEDS_MAC"
          [[ "$CHANGES" == success && "$PORTABLE" == success && "$PROCESS" == success ]]
          if [[ "$NEEDS_MAC" == true ]]; then [[ "$MACOS" == success ]]; else [[ "$MACOS" == skipped ]]; fi
