# Publishes every main commit whose CI passed and that changed the app as an update
# (ADR 0010): Scripts/release.sh builds Release on GitHub's macOS runner, signs
# the Sparkle archive with the app's EdDSA update key, and publishes v<x.y.z> with a disk image and
# Sparkle's feed. Installed copies find it within the hour. Nothing here needs a Mac of anyone's.
#
# It runs only after CI passed on a push to main, so no pull request ever reaches its one secret,
# SPARKLE_SEED: a random password of 32+ characters the update key is derived from
# (Scripts/sparkle-key.sh). Its master copy is the secret markdown-editor-sparkle-seed in the Azure Key
# Vault the environment's AZURE_KEY_VAULT names, managed outside this repository. The first step
# fetches it keylessly: GitHub's OIDC token for the environment "release" is exchanged for a token
# of an Entra app that trusts only this repository's environment "release". The environment
# deploys only from main and holds only the variables AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_KEY_VAULT, none of them secret. Changing the seed breaks updates for every installed copy,
# so it is set once and kept. The app is signed ad hoc and is not notarized: there is no Apple
# Developer account (ADR 0015).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish update
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write # the OIDC token the Key Vault fetch exchanges
    steps:
      - name: Fetch release secrets from Azure Key Vault
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          # ENV_NAME=vault-secret-name, one per line
          SECRET_MAP: |
            SPARKLE_SEED=markdown-editor-sparkle-seed
        run: |
          set -euo pipefail
          j() { python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"; }
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | j value)
          echo "::add-mask::$oidc"
          tok=$(curl -sSf "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            -d client_id="$AZURE_CLIENT_ID" -d grant_type=client_credentials \
            --data-urlencode scope=https://vault.azure.net/.default \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode client_assertion="$oidc" | j access_token)
          echo "::add-mask::$tok"
          while IFS='=' read -r name secret; do
            [ -n "$name" ] || continue
            v=$(curl -sSf -H "Authorization: Bearer $tok" \
              "https://$AZURE_KEY_VAULT.vault.azure.net/secrets/$secret?api-version=7.4" | j value)
            echo "::add-mask::$v"
            d="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$d" "$v" "$d" >> "$GITHUB_ENV"
          done <<< "$SECRET_MAP"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the build number is the commit count
          persist-credentials: false

      - name: Select the newest Xcode 27, and OpenSSL 3
        id: tools
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          # macOS's own openssl is LibreSSL, which cannot sign with Ed25519.
          prefix="$(brew --prefix openssl@3 2>/dev/null || true)"
          [ -x "$prefix/bin/openssl" ] || { brew install openssl@3 >/dev/null; prefix="$(brew --prefix openssl@3)"; }
          "$prefix/bin/openssl" version
          echo "openssl=$prefix/bin/openssl" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish (Scripts/release.sh)
        env:
          SPARKLE_SEED: ${{ env.SPARKLE_SEED }}
          OPENSSL: ${{ steps.tools.outputs.openssl }}
          GH_TOKEN: ${{ github.token }}
        run: Scripts/release.sh
