# Re-runs a CI or Release run whose job GitHub never started: a hosted macOS runner was never
# assigned, and after 15 minutes the job ended "cancelled" or "abandoned" with no runner and no
# steps (CI 45860219913 and Release 45866221874 on 2026-11-26; docs/ROADMAP.md). That is GitHub's
# capacity, not this repository's code, so the remedy is to ask again rather than to wait for a
# person to notice.
#
# A run is retried only when some job of it never started, only while the commit is still the tip
# of its branch (a newer push supersedes it), and at most twice (run_attempt 1 and 2). A job that
# ran and failed is never retried here: that is a failure to fix, not a runner to wait for.
name: Retry unstarted jobs

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Retry a run GitHub never started
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          unstarted="$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --jq '[.jobs[] | select((.conclusion == "cancelled" or .conclusion == "failure") and ((.runner_id // 0) == 0) and ((.steps // []) | length) == 0) | .name] | join(", ")')"
          if [ -z "$unstarted" ]; then
            echo "$NAME run $RUN attempt $ATTEMPT: every job started; nothing to retry."
            exit 0
          fi
          tip="$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ "$tip" != "$SHA" ]; then
            echo "$NAME run $RUN: $BRANCH has moved on from $SHA; not retrying."
            exit 0
          fi
          echo "::warning::$NAME run $RUN attempt $ATTEMPT: never started: $unstarted. Re-running its failed jobs."
          gh run rerun "$RUN" --failed --repo "$REPO"
