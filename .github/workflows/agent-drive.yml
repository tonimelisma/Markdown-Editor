# An agent's hands and eyes on the real app (CLAUDE.md §4, docs/DECISIONS.md 2026-11-27). A cloud
# session cannot see a Mac; this builds the app on a GitHub Mac runner, opens a fixture, runs a
# scenario of clicks, keys, menu choices and accessibility presses (Scripts/agent-drive.swift), and
# uploads what it saw after each step: window screenshots, accessibility trees, element values, the
# saved file and the app's own diagnostic log. The agent downloads the artifact and looks.
#
# Never a gate and never a requirement's proof: nothing requires this workflow, and what it finds is
# fixed with a unit or component test that fails for it.
#
# Start it with GitHub's tools: actions_run_trigger, method run_workflow, workflow agent-drive.yml,
# ref = the branch to build, inputs.scenario = the steps (newline-separated). Read the result with
# actions_list (list_workflow_run_artifacts) and actions_get (download_workflow_run_artifact); the
# artifact is agent-drive-<run id>, and transcript.txt in it lists every step and file.
name: Agent drive

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Steps, one per line (Scripts/agent-drive.swift); empty runs Scripts/agent-drive-default.txt
        default: ""
      fixture:
        description: The document to open, a file in Scripts/Fixtures
        default: smoke-rich.md
  pull_request:
    paths:
      - .github/workflows/agent-drive.yml
      - Scripts/agent-drive.swift
      - Scripts/agent-drive-default.txt

permissions:
  contents: read

jobs:
  drive:
    name: Drive and look
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the newest Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      # main's compilation cache, read only, as ci.yml restores it.
      - name: Restore the build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .build/check/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-
      - name: Build the app and the driver
        run: |
          set -euo pipefail
          mkdir -p out
          source Scripts/lib/build-settings.sh
          xcodebuild -project "Markdown Editor.xcodeproj" -scheme "Markdown Editor" -configuration Debug \
            -derivedDataPath .build/check -destination 'platform=macOS' \
            "${verification_build_settings[@]}" build > out/build.log 2>&1 \
            || { tail -n 60 out/build.log; exit 1; }
          swiftc -O Scripts/agent-drive.swift -o .build/agent-drive
          swiftc -O Scripts/find-window-id.swift -o .build/find-window-id
      - name: Drive
        env:
          SCENARIO: ${{ inputs.scenario }}
          FIXTURE: ${{ inputs.fixture || 'smoke-rich.md' }}
        run: |
          set -uo pipefail
          [[ "$FIXTURE" =~ ^[A-Za-z0-9._-]+$ && -f "Scripts/Fixtures/$FIXTURE" ]] \
            || { echo "::error::fixture must be a file in Scripts/Fixtures"; exit 1; }
          if [[ -n "$SCENARIO" ]]; then printf '%s\n' "$SCENARIO" > out/scenario.txt
          else cp Scripts/agent-drive-default.txt out/scenario.txt; fi
          app=".build/check/Build/Products/Debug/Markdown Editor.app"
          work="$(mktemp -d)"; cp -R Scripts/Fixtures/. "$work/"; doc="$work/$FIXTURE"
          caffeinate -d -i -u -t 900 &
          MARKDOWN_EDITOR_DIAGNOSTICS_DIR="$PWD/out/diagnostics" \
            "$app/Contents/MacOS/Markdown Editor" -ApplePersistenceIgnoreState YES "$doc" > out/app-output.txt 2>&1 &
          pid=$!
          wid=""
          for _ in $(seq 1 150); do
            wid="$(.build/find-window-id "$pid" 2>/dev/null | head -n 1)"
            [[ -n "$wid" ]] && break
            sleep 0.2
          done
          [[ -n "$wid" ]] || { echo "::error::the app's window never appeared"; kill "$pid"; exit 1; }
          sleep 2 # let the opening parse land before the first step
          verdict=0
          .build/agent-drive "$pid" "$wid" out "$doc" < out/scenario.txt || verdict=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          case "$verdict" in
            0) echo "agent-drive: every expectation held" ;;
            1) echo "::warning::agent-drive: an expectation failed (transcript.txt)" ;;
            *) echo "::error::agent-drive could not run the scenario"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-drive-${{ github.run_id }}
          path: out/
          retention-days: 14
