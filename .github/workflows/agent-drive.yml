# An agent's hands and eyes on the real app (CLAUDE.md §4, ADR 0017). A cloud
# session cannot see a Mac; this builds the app on a GitHub Mac runner and runs a scenario
# (Scripts/agent-drive.swift) that launches it, as the Dock and Finder do, and uses it: clicks, keys,
# menu choices, panels, the clipboard, other apps changing its files, quitting and relaunching. It
# uploads what it saw after each step: window and screen captures, accessibility trees, element
# values, files and the app's own diagnostic log. The agent downloads the artifact and looks.
#
# Never a gate and never a requirement's proof: nothing requires this workflow, and what it finds is
# fixed with a unit or component test that fails for it. It also runs the whole tour weekly.
#
# Start it with GitHub's tools: actions_run_trigger, method run_workflow, workflow agent-drive.yml,
# ref = the branch to build, inputs.scenario = the steps (newline-separated). Read the result with
# actions_list (list_workflow_run_artifacts) and actions_get (download_workflow_run_artifact); the
# artifact is agent-drive-<run id>, and transcript.txt in it lists every step and file.
name: Agent drive

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Steps, one per line (Scripts/agent-drive.swift); empty runs scenario_file
        default: ""
      scenario_file:
        description: A scenario in Scripts/agent-drive, used when scenario is empty
        default: tour.txt
      configuration:
        description: Release (the bundle release.sh publishes, ad hoc, no update key) or Debug (profilable)
        default: Release
  schedule:
    # Weekly, off the hour: the whole tour on main, Release, so a regression no unit test sees
    # still shows up. A failed expectation fails this run (it only warns when started by hand).
    - cron: "37 4 * * 3"
  pull_request:
    paths:
      - .github/workflows/agent-drive.yml
      - Scripts/agent-drive.swift
      - Scripts/agent-drive/**

permissions:
  contents: read

jobs:
  drive:
    name: Drive and look
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest Xcode 27
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      # main's compilation cache, read only, as ci.yml restores it.
      - name: Restore the build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .build/check/SourcePackages
          key: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.xcode.outputs.build }}-
      # Release by default: the tour's timings and budget records then describe the build people
      # run, not an unoptimised one (ADR 0025). Hardened as repeat-smoke.yml
      # hardens its Release bundle. Debug is for `sample`, which cannot attach to a hardened app.
      - name: Build the app and the driver
        id: bundle
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          mkdir -p out
          source Scripts/lib/build-settings.sh
          case "$CONFIGURATION" in
            Debug)
              xcodebuild -project "Markdown Editor.xcodeproj" -scheme "Markdown Editor" -configuration Debug \
                -derivedDataPath .build/check -destination 'platform=macOS' \
                "${verification_build_settings[@]}" build > out/build.log 2>&1 \
                || { grep -A4 ': error:' out/build.log | head -n 60; tail -n 20 out/build.log; exit 1; }
              app="$PWD/.build/check/Build/Products/Debug/Markdown Editor.app" ;;
            Release)
              xcodebuild -project "Markdown Editor.xcodeproj" -scheme "Markdown Editor" -configuration Release \
                -derivedDataPath .build/check -destination 'platform=macOS' \
                "${verification_build_settings[@]}" OTHER_CODE_SIGN_FLAGS=--timestamp=none build > out/build.log 2>&1 \
                || { grep -A4 ': error:' out/build.log | head -n 60; tail -n 20 out/build.log; exit 1; }
              app="$PWD/.build/check/Build/Products/Release/Markdown Editor.app"
              Scripts/adhoc-harden.sh "$app" --timestamp=none "$RUNNER_TEMP/adhoc.entitlements" ;;
            *)
              echo "::error::configuration must be Debug or Release"; exit 1 ;;
          esac
          echo "configuration: $CONFIGURATION" > out/configuration.txt
          echo "app=$app" >> "$GITHUB_OUTPUT"
          swiftc -O Scripts/agent-drive.swift -o .build/agent-drive
      - name: Drive
        env:
          SCENARIO: ${{ inputs.scenario }}
          SCENARIO_FILE: ${{ inputs.scenario_file || 'tour.txt' }}
        run: |
          set -uo pipefail
          if [[ -n "$SCENARIO" ]]; then printf '%s\n' "$SCENARIO" > out/scenario.txt
          else
            [[ "$SCENARIO_FILE" =~ ^[A-Za-z0-9._-]+$ && -f "Scripts/agent-drive/$SCENARIO_FILE" ]] \
              || { echo "::error::scenario_file must be a file in Scripts/agent-drive"; exit 1; }
            cp "Scripts/agent-drive/$SCENARIO_FILE" out/scenario.txt
          fi
          app="${{ steps.bundle.outputs.app }}"
          work="$RUNNER_TEMP/work"; rm -rf "$work"; mkdir -p "$work"; cp -R Scripts/Fixtures/. "$work/"
          caffeinate -d -i -u -t 1800 &
          verdict=0
          .build/agent-drive "$app" "$work" out "$PWD/out/diagnostics" < out/scenario.txt || verdict=$?
          cp -R "$work" out/work 2>/dev/null || true
          case "$verdict" in
            0) echo "agent-drive: every expectation held" ;;
            1) if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
                 echo "::error::agent-drive: an expectation failed (transcript.txt)"; exit 1
               fi
               echo "::warning::agent-drive: an expectation failed (transcript.txt)" ;;
            *) echo "::error::agent-drive could not run the scenario"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-drive-${{ github.run_id }}
          path: out/
          retention-days: 14
