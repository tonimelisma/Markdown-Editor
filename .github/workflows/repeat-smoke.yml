# Runs the smoke test many times on one macOS runner and keeps every run's diagnostics, to chase a
# failure that comes and goes, such as the mainActorStall that blocked v1.0.1 (docs/ROADMAP.md). It
# is a cloud session's way to reproduce, not a gate: nothing requires it, and it runs only when
# started (GitHub's tools: actions_run_trigger, method run_workflow, workflow repeat-smoke.yml).
#
#   configuration  Debug: the app check.sh launches. Release: built and hardened the way
#                  Scripts/release.sh builds the bundle it publishes (ad hoc, no update key).
#   sample         Each launch is also profiled with `spindump` for its first 6 s, so a stall leaves
#                  every thread's stack and what a blocked thread waits on. Both profilers are run
#                  once on a throwaway process first: run 45923148087's first `sample` was empty,
#                  having paid its own first-use cost during the very launch it was to profile.
#                  Profiling suspends the process briefly many times, so a profiled run's own
#                  verdict is weaker evidence than an unprofiled one.
#   warm           Whether the profilers are first run on a throwaway process (default true).
#   settle         Seconds to wait between the build and the first launch. Run 45923942236's
#                  warm-up delayed its first launch by several seconds, and that launch did not
#                  stall, so this separates "the profiler was cold" from "the machine was busy".
#   fresh          Each launch is of a new copy of the bundle at a new path. A stall seen only on
#                  the first launch of a bundle (repeat-smoke 45923148087, 45923150495) then
#                  shows on every launch, or does not, which says whether newness is the trigger.
name: Repeat smoke

on:
  workflow_dispatch:
    inputs:
      count:
        description: How many smoke runs
        default: "12"
      configuration:
        description: Debug or Release
        default: Debug
      sample:
        description: Profile each launch with spindump (true or false)
        default: "false"
      warm:
        description: Run the profilers once on a throwaway process first (true or false)
        default: "true"
      settle:
        description: Seconds to wait after the build before the first launch
        default: "0"
      fresh:
        description: Launch a new copy of the bundle at a new path each time (Release only; true or false)
        default: "false"

permissions:
  contents: read

jobs:
  repeat:
    name: Smoke, repeated
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the newest Xcode 27
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build the bundle to launch
        id: bundle
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          case "$CONFIGURATION" in
            Debug)
              # smoke-test.sh builds it on the first run and reuses the build folder after that.
              echo "app=" >> "$GITHUB_OUTPUT" ;;
            Release)
              source Scripts/lib/build-settings.sh
              xcodebuild -project "Markdown Editor.xcodeproj" -scheme "Markdown Editor" \
                -configuration Release -destination 'generic/platform=macOS' \
                -derivedDataPath .build/repeat-release "${verification_build_settings[@]}" \
                OTHER_CODE_SIGN_FLAGS=--timestamp=none build > .build-release.log 2>&1 \
                || { tail -n 60 .build-release.log; exit 1; }
              app="$PWD/.build/repeat-release/Build/Products/Release/Markdown Editor.app"
              Scripts/adhoc-harden.sh "$app" --timestamp=none "$RUNNER_TEMP/adhoc.entitlements"
              codesign --display --entitlements - "$app"
              echo "app=$app" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::configuration must be Debug or Release"; exit 1 ;;
          esac
      - name: Smoke runs
        env:
          COUNT: ${{ inputs.count }}
          SAMPLE: ${{ inputs.sample }}
          FRESH: ${{ inputs.fresh }}
          WARM: ${{ inputs.warm }}
          SETTLE: ${{ inputs.settle }}
          APP: ${{ steps.bundle.outputs.app }}
        run: |
          set -uo pipefail
          [[ "$COUNT" =~ ^[1-9][0-9]?$ ]] || { echo "::error::count must be 1 to 99"; exit 1; }
          records=.build/repeat-records
          mkdir -p "$records"
          [[ "$SETTLE" =~ ^[0-9]{1,3}$ ]] || { echo "::error::settle must be 0 to 999"; exit 1; }
          failed=0
          if [[ "$SAMPLE" == "true" && "$WARM" != "false" ]]; then
            sleep 30 & warm=$!
            sudo spindump "$warm" 1 -file "$RUNNER_TEMP/warm.spindump" > /dev/null 2>&1 || true
            sudo sample "$warm" 1 -file "$RUNNER_TEMP/warm.sample" > /dev/null 2>&1 || true
            kill "$warm" 2>/dev/null || true
          fi
          sleep "$SETTLE"
          for i in $(seq 1 "$COUNT"); do
            app="$APP"
            if [[ "$FRESH" == "true" && -n "$APP" ]]; then
              app="$RUNNER_TEMP/fresh-$i/Markdown Editor.app"
              mkdir -p "$(dirname "$app")"
              ditto "$APP" "$app"
            fi
            SMOKE_APP="$app" SMOKE_DERIVED_DATA=.build/repeat SMOKE_LOG_COPY_DIR="$records/run-$i" \
              Scripts/smoke-test.sh > "$records/smoke-$i.log" 2>&1 &
            smoke=$!
            # What else the machine is doing during the launch: a stall only the first launch after
            # a build shows may be the app's, or may be the host's.
            top -l 8 -s 1 -o cpu -n 8 -stats pid,command,cpu,state > "$records/top-$i.txt" 2>&1 &
            if [[ "$SAMPLE" == "true" ]]; then
              # The first Debug run builds before it launches, so wait for the process, not a clock.
              pid=""
              for _ in $(seq 1 3000); do
                pid="$(pgrep -n -f 'Markdown Editor.app/Contents/MacOS/Markdown Editor' || true)"
                [[ -n "$pid" ]] && break
                kill -0 "$smoke" 2>/dev/null || break
                sleep 0.1
              done
              if [[ -n "$pid" ]]; then
                # A hardened app without get-task-allow can be profiled only by root.
                sudo spindump "$pid" 6 10 -file "$records/spindump-$i.txt" > /dev/null 2>&1 || true
              fi
            fi
            # The step's shell is bash -e: a bare failing `wait` would end the loop at the first failure.
            verdict=0
            wait "$smoke" || verdict=$?
            wait # top, so one launch's sampling of the host never overlaps the next launch
            if (( verdict == 0 )); then
              echo "run $i: PASS $(grep -o 'launch→exit took [0-9]*s' "$records/smoke-$i.log")"
            else
              failed=$((failed + 1))
              echo "run $i: FAIL $(grep -o 'launch→exit took [0-9]*s' "$records/smoke-$i.log") $(grep 'diagnostics FAIL' "$records/smoke-$i.log")"
              grep 'mainActorStall\|budgetExceeded' "$records/smoke-$i.log" | sed 's/^/    /'
            fi
          done
          echo "smoke runs: $COUNT, failed: $failed"
          # spindump lists the main thread first under the process; print its heaviest frames.
          for f in "$records"/spindump-*.txt; do
            [[ -f "$f" ]] || continue
            echo "== $f: main thread"
            awk '/^ *Thread 0x[0-9a-f]+ .*(DispatchQueue \"com.apple.main-thread\"|main-thread)/ {on=1} on {print; if (++n >= 120) exit}' "$f" | cut -c1-200
          done
          sudo chown -R "$(id -u)" "$records" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repeat-smoke-${{ github.run_id }}
          path: .build/repeat-records/
          retention-days: 14
