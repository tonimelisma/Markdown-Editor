# Settings for script/process-check and script/pr-check (see the kit's defaults in
# script/process-check). Globs are space-separated; `?` stands for the space in "Markdown EditorTests".

# Requirement IDs. ARC-### invariants (docs/architecture.md) and COR-/INC- increment names are
# not requirements: tests cite them with `Verifies:`, which nothing checks.
id_regex = REQ-[0-9]{3}

requirements = docs/requirements.md

# Unit and component tests, and the shell tests the gate runs (Scripts/check.sh).
tests = Markdown?EditorTests/** Scripts/test-*.sh

validates =

docs = CLAUDE.md README.md docs/**/*.md

cited_exts = md py sh swift yml yaml jsonl

# NNNN: placeholders; `.md`-style extension names. The rest are files the ADRs and research name
# as deleted, or that live in the sibling repositories the research compares (latchkey, Otos).
ignore_paths = NNNN YYYY-MM-DD ^docs/plans/ ^\.md$ ^\.markdown$ fast-check\.sh full-check\.sh release-setup\.sh DISC01_POC mac-tag\.yml mac-build\.yml agent-instruction-files ci-only-macos-development ^script/check\.sh$ ^script/cloud-setup\.sh$ ^\.claude/rules/
